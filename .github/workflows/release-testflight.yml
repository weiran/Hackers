name: Release TestFlight

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload, for example v5.3.0+153"
        required: true
        type: string
      distribute_existing:
        description: "Distribute an existing TestFlight build externally without uploading a new build"
        required: false
        type: boolean
        default: false
      external_groups:
        description: "Optional comma-separated external TestFlight groups"
        required: false
        type: string
      what_to_test:
        description: "Optional custom TestFlight What to Test text; overrides generated notes"
        required: false
        type: string
      local_ipa_asset:
        description: "Optional IPA asset already attached to the release tag; skips the GitHub-hosted archive"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-testflight-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  CI_DEVICE_NAME: iPhone 17 Pro
  XCODE_VERSION_FILE: .github/xcode-version
  BUNDLE_WITHOUT: development
  BUNDLE_VERSION: system

jobs:
  testflight:
    name: testflight
    runs-on: xcode-27
    timeout-minutes: 120
    environment: testflight
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.distribute_existing == 'true' && 'master' || github.event.inputs.release_tag || github.ref }}

      - name: Prepare Xcode
        run: scripts/ci/setup-xcode-simulator.sh --xcode-only

      - name: Install Bundler dependencies
        run: |
          bundle config set path vendor/bundle
          bundle install

      - name: Resolve release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          CUSTOM_WHAT_TO_TEST: ${{ github.event.inputs.what_to_test }}
        run: |
          mkdir -p artifacts/release
          RELEASE_NOTES=artifacts/release/what-to-test.txt

          if [ -n "$CUSTOM_WHAT_TO_TEST" ]; then
            printf '%s\n' "$CUSTOM_WHAT_TO_TEST" > "$RELEASE_NOTES"
          else
            PREVIOUS_RELEASE_TAG=$(gh release list --json tagName,isDraft,publishedAt --limit 200 \
              | jq -r --arg TAG "$RELEASE_TAG" '[.[] | select(.isDraft == false and .tagName != $TAG)] | .[0].tagName')
            PREVIOUS_TAG=$(git tag --sort=-creatordate --list 'v*' \
              | awk -v TAG="$RELEASE_TAG" 'BEGIN { found=0 } \
                { if ($0 == TAG) { found=1; next } if (found) { print; exit } }')

            RELEASE_IS_DRAFT=$(gh release view "$RELEASE_TAG" --json isDraft -q .isDraft 2>/dev/null || echo true)

            if [ "$RELEASE_IS_DRAFT" = "true" ] && [ -n "$PREVIOUS_TAG" ]; then
              NOTE_START_TAG="$PREVIOUS_TAG"
            elif [ "$PREVIOUS_RELEASE_TAG" != "null" ] && [ -n "$PREVIOUS_RELEASE_TAG" ]; then
              NOTE_START_TAG="$PREVIOUS_RELEASE_TAG"
            else
              NOTE_START_TAG=""
            fi

            if [ -n "$NOTE_START_TAG" ]; then
              PAYLOAD=$(jq -nc --arg tag "$RELEASE_TAG" --arg prev "$NOTE_START_TAG" '{tag_name:$tag, previous_tag_name:$prev}')
              printf '%s' "$PAYLOAD" | gh api --method POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/generate-notes" --input - --jq .body > "$RELEASE_NOTES"
            else
              PAYLOAD=$(jq -nc --arg tag "$RELEASE_TAG" '{tag_name:$tag}')
              printf '%s' "$PAYLOAD" | gh api --method POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/generate-notes" --input - --jq .body > "$RELEASE_NOTES"
            fi
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "${RELEASE_TAG#v}" --notes-file "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "${RELEASE_TAG#v}" --notes-file "$RELEASE_NOTES" --draft
          fi

          if [ ! -s artifacts/release/what-to-test.txt ]; then
            echo "GitHub Release body is required for TestFlight What to Test" >&2
            exit 1
          fi

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.distribute_existing != 'true' && github.event.inputs.local_ipa_asset == '' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          WHAT_TO_TEST_FILE: artifacts/release/what-to-test.txt
          TESTFLIGHT_GROUPS: ${{ github.event.inputs.external_groups }}
        run: bundle exec fastlane ios beta release_tag:"$RELEASE_TAG"

      - name: Download local IPA asset
        if: ${{ github.event.inputs.distribute_existing != 'true' && github.event.inputs.local_ipa_asset != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          LOCAL_IPA_ASSET: ${{ github.event.inputs.local_ipa_asset }}
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern "$LOCAL_IPA_ASSET" \
            --dir artifacts/release \
            --clobber
          test -f "artifacts/release/$LOCAL_IPA_ASSET"

      - name: Upload local IPA to TestFlight
        if: ${{ github.event.inputs.distribute_existing != 'true' && github.event.inputs.local_ipa_asset != '' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          WHAT_TO_TEST_FILE: artifacts/release/what-to-test.txt
          LOCAL_IPA_PATH: artifacts/release/${{ github.event.inputs.local_ipa_asset }}
          TESTFLIGHT_GROUPS: ${{ github.event.inputs.external_groups }}
        run: bundle exec fastlane ios upload_existing_testflight release_tag:"$RELEASE_TAG" ipa_path:"$LOCAL_IPA_PATH"

      - name: Distribute Existing TestFlight Build
        if: ${{ github.event.inputs.distribute_existing == 'true' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          WHAT_TO_TEST_FILE: artifacts/release/what-to-test.txt
          TESTFLIGHT_GROUPS: ${{ github.event.inputs.external_groups }}
        run: bundle exec fastlane ios distribute_existing_testflight release_tag:"$RELEASE_TAG"

      - name: Release summary
        if: always()
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          {
            echo "## TestFlight Release"
            echo
            echo "- Tag: ${RELEASE_TAG}"
            if [ -f artifacts/release/build-number.txt ]; then
              echo "- Uploaded build: $(cat artifacts/release/build-number.txt)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testflight-artifacts
          path: |
            artifacts/release
            artifacts/logs
          if-no-files-found: ignore
          retention-days: 90
