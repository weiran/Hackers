<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light dark; }
    body {
      box-sizing: border-box;
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px 180px;
      font: -apple-system-body;
      line-height: 1.55;
      background: Canvas;
      color: CanvasText;
    }
    h1 {
      margin: 0 0 20px;
      font: -apple-system-title1;
      font-weight: 700;
      line-height: 1.15;
    }
    p { margin: 0 0 18px; }
    label { display: block; margin: 28px 0 8px; font-weight: 600; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      font: -apple-system-body;
    }
  </style>
</head>
<body>
  <article id="fixture-page">
    <h1>{{TITLE}}</h1>
    <p>{{BODY}}</p>
    <label for="reader-note">Reader note</label>
    <input id="reader-note" aria-label="Reader note" placeholder="Type a note">
  </article>
</body>
</html>
