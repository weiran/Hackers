    <p id="media-autoplay-result" aria-label="Media autoplay result">pending</p>

  <script>
    (() => {
      const video = document.getElementById("media-autoplay-video");
      const state = document.getElementById("media-autoplay-state");
      const started = document.getElementById("media-autoplay-started");
      const result = document.getElementById("media-autoplay-result");
      let hasStarted = false;

      function setState(value) {
        state.textContent = value;
        state.setAttribute("aria-label", "Media autoplay state: " + value);
      }

      video.addEventListener("playing", () => {
        hasStarted = true;
        started.textContent = "started";
        started.setAttribute("aria-label", "Media autoplay started: started");
        result.textContent = "started";
        result.setAttribute("aria-label", "Media autoplay result: started");
        setState("playing");
      });
      video.addEventListener("pause", () => setState("paused"));
      video.addEventListener("error", () => setState("error"));
      setState("attempting");
      video.play()
        .then(() => setState("play-resolved"))
        .catch(error => setState("play-rejected-" + error.name));
      setTimeout(() => {
        if (!hasStarted) {
          result.textContent = "blocked";
          result.setAttribute("aria-label", "Media autoplay result: blocked");
        }
      }, 2000);
    })();
  </script>
